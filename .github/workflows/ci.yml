name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Every crate keeps its own target directory, so the cache has to name each
      # one. `ui` alone would miss ui/src-tauri/target, which is where the exe
      # actually lands.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            executor
            injector
            ui/src-tauri

      # The compiler sits in the trust boundary: host builds bytecode with it,
      # the client's VM runs the bytes. Pin it by hash so a swapped file fails
      # here instead of producing bytecode the client refuses.
      - name: luau compiler pin
        shell: pwsh
        run: |
          $want = "870665FDC7E751EB266EA8BEEC2CDA64762C9B6B689E8A466FEEDAAEEFC8DD3D"
          $got = (Get-FileHash vendor\luau\luau-compile.exe -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "luau-compile.exe hash mismatch: $got" }
          "luau-compile pinned ok"

      # build.bat finds the MSVC toolset through vswhere, so the same script
      # works on a runner (Enterprise) and on a dev box (BuildTools/Community).
      # Stage 64 is the long-lived dispatcher build; the default stage 4 is a
      # hello stub and is not what any verified run uses.
      - name: payload
        shell: cmd
        run: payload\build.bat 64

      - name: payload artifact check
        shell: pwsh
        run: |
          $dll = Get-Item payload\build\zendo.dll
          if ($dll.Length -lt 10kb) { throw "payload too small: $($dll.Length) bytes" }
          $pe = [System.IO.File]::ReadAllBytes($dll.FullName)
          $lfanew = [BitConverter]::ToUInt32($pe, 0x3C)
          $opt = $lfanew + 0x18
          $magic = [BitConverter]::ToUInt16($pe, $opt)
          if ($magic -ne 0x20B) { throw ("not PE32+: magic 0x{0:x}" -f $magic) }
          # data directory 1 is the import table; it must be empty, the payload
          # resolves every Win32 entry itself from the PEB
          $impRva = [BitConverter]::ToUInt32($pe, $opt + 0x78)
          if ($impRva -ne 0) { throw ("payload has an import directory at RVA 0x{0:x}" -f $impRva) }
          "payload ok: {0} bytes, PE32+, no imports" -f $dll.Length

      - name: executor
        run: cargo build --release --manifest-path executor/Cargo.toml

      - name: executor tests
        run: cargo test --release --manifest-path executor/Cargo.toml

      # Proves the checkout is self-contained: no ZENDO_COMPILER, no D:\zend.
      - name: compiler resolves to vendor
        shell: pwsh
        run: |
          $out = cargo run --release --manifest-path executor/Cargo.toml --example compilercheck
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -match 'vendor\\luau\\luau-compile.exe \(exists=True')) { throw "compiler did not resolve to vendor" }
          if (-not ($out -match 'deferred chunk ok')) { throw "deferred chunk failed to compile" }

      - name: injector
        run: cargo build --release --manifest-path injector/Cargo.toml

      # The frontend is git-ignored (dist/), and tauri with custom-protocol
      # embeds it at compile time - cargo build alone fails on a fresh clone.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: ui frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: ui
        run: cargo build --release --features custom-protocol --manifest-path ui/src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: zendo-win64
          if-no-files-found: error
          path: |
            payload/build/zendo.dll
            injector/target/release/zendo-inject.exe
            executor/target/release/zendo-exec.exe
            ui/src-tauri/target/release/zendo-ui.exe
